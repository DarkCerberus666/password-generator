<!DOCTYPE html>
<html lang="en">
<head> 
    <link rel="stylesheet" href="style.css">
    <title>
        Gerador de Senhas
    </title>
</head>
<body>
<div class="container">
<h1>Crie sua senha</h1>
<p id="labelsenha">Escolha o tamanho da senha:</p>  
<input type="number" id="TamanhoSenha" min="1" max="40" value="12">

<div class="options">
    <label><input type="checkbox" id="usarSimbolos"> Incluir símbolos</label>
    <label><input type="checkbox" id="usarNumeros"> Incluir números</label>
    <label><input type="checkbox" id="usarLetrasMaiusculas"> Incluir letras maiúsculas</label>
    <label><input type="checkbox" id="usarLetrasMinusculas"> Incluir letras minúsculas</label>
</div>
<button onclick="GerarSenha()">Gerar Senha</button>
<p id="senhaGerada"></p>
<button id="copiarSenha" onclick="CopiarSenha()">Copiar Senha</button>
<button id="toggleTheme">🌙 Alternar Tema</button>
</div>
<script src="script.js"></script>
</body>
</html>
